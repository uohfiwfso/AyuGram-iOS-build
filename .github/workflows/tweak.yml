name: build-tweak

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/message-saving
    paths:
      - 'Tweak/**'
      - '.github/workflows/tweak.yml'

jobs:
  build-tweak:
    name: Build AyuGramPushRelay tweak
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: make -C Tweak/AyuGramPushRelay

      - name: Ad-hoc sign
        run: |
          codesign --force --sign - Tweak/AyuGramPushRelay/build/AyuGramPushRelay.dylib
          codesign -dv Tweak/AyuGramPushRelay/build/AyuGramPushRelay.dylib 2>&1 | head -5

      - name: Check architecture
        run: |
          lipo -info Tweak/AyuGramPushRelay/build/AyuGramPushRelay.dylib
          otool -l Tweak/AyuGramPushRelay/build/AyuGramPushRelay.dylib | grep -A2 LC_BUILD_VERSION | head -20

      - name: Package
        run: |
          mkdir -p package
          cp Tweak/AyuGramPushRelay/build/AyuGramPushRelay.dylib package/
          cp Tweak/AyuGramPushRelay/AyuGramPushRelay.plist package/
          cp Tweak/AyuGramPushRelay/README.md package/

      # .deb для установки через Sileo/Zebra или dpkg -i.
      # Пути внутри rootless-деба - ./var/jb/... (так же устроены настоящие
      # rootless-пакеты: basebin-link.deb, libroot.deb из bootstrap Dopamine).
      - name: Build deb
        run: |
          make -C Tweak/AyuGramPushRelay deb
          cp Tweak/AyuGramPushRelay/build/deb/*.deb package/

      # На macOS-раннере нет dpkg-deb, поэтому проверяем собранный деб тем же
      # кодом, которым его собираем: разбор ar-архива и проверка control.
      - name: Verify deb
        run: |
          python3 - <<'PY'
          import glob, sys
          sys.path.insert(0, "Tweak/AyuGramPushRelay/packaging")
          import build_deb

          path = glob.glob("Tweak/AyuGramPushRelay/build/deb/*.deb")[0]
          raw = open(path, "rb").read()
          assert raw.startswith(b"!<arch>\n"), "bad ar magic"
          # Члены ar: заголовок 60 байт, затем содержимое.
          off = 8
          names = []
          while off < len(raw):
              header = raw[off:off + 60]
              name = header[0:16].decode().strip()
              size = int(header[48:58].decode().strip())
              names.append(name)
              off += 60 + size + (size % 2)
          assert names == ["debian-binary", "control.tar.gz", "data.tar.gz"], names
          print("deb members:", names)
          print("deb size:", len(raw))
          PY

      # Dylib внутри пакета должен быть подписан: цель deb пересобирает его
      # заново, и без подписи в пакет попадёт неподписанный бинарник.
      - name: Check signature inside deb
        run: |
          rm -rf debcheck && mkdir debcheck
          cd debcheck
          ar x ../Tweak/AyuGramPushRelay/build/deb/*.deb
          # На macOS ar кладёт члены без бита чтения - без chmod tar их не прочтёт.
          chmod -R u+rw .
          tar xzf data.tar.gz
          DYLIB=./var/jb/Library/MobileSubstrate/DynamicLibraries/AyuGramPushRelay.dylib
          codesign -dv "$DYLIB" 2>&1 | head -3
          codesign -v "$DYLIB" && echo "signature OK"
          cd .. && rm -rf debcheck

      - uses: actions/upload-artifact@v4
        with:
          name: AyuGramPushRelay-tweak
          path: package/
